<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenájdená | studnenakluc.sk</title>
  <meta name="description" content="Požadovaná stránka nebola nájdená. Vráťte sa na hlavnú stránku studnenakluc.sk." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --primary: #0b5ed7;
      --secondary: #6c757d;
      --bg: #f8f9fa;
      --text: #212529;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: 96px;
      color: var(--primary);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
      color: var(--secondary);
    }

    a.button {
      display: inline-block;
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }

    a.button:hover {
      background: #084298;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💧</div>
    <h1>404</h1>
    <h2>Stránka nenájdená</h2>
    <p>Prepáčte, požadovaná stránka neexistuje alebo bola presunutá.</p>
    <a href="/" class="button">Späť na hlavnú stránku</a>
  </div>
</body>
</html>
